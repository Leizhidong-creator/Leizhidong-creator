      <text x="58" y="246" font-size="22" font-weight="800">AI APPLICATION DEVELOPER</text>
      <text x="58" y="276" font-size="22" font-weight="800">&amp; AGENT BUILDER</text>

      <g transform="translate(58 307)" font-family="'IBM Plex Mono','Consolas',monospace" font-size="13" font-weight="700">
