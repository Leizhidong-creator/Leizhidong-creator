<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Zhidong Lei, AI application developer and agent builder</title>
  <desc id="desc">A lively editorial comic illustration of Zhidong Lei with a small data spirit, using coral orange, lake blue, and lemon yellow.</desc>
  <defs>
    <clipPath id="paper">
      <rect x="8" y="8" width="1184" height="464" rx="26"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#17212B" flood-opacity="0.12"/>
    </filter>
  </defs>
