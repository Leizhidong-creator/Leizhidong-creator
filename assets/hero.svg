        <text x="19" y="26" font-size="16" font-weight="700">Building AI that empowers creativity</text>
        <text x="19" y="49" font-size="16" font-weight="700">and turns ideas into meaningful products.</text>
        <path d="M403 14l9 7 11-12-5 16 14 5-17 1-1 17-6-15-16 5 12-11z" fill="#FFD84D"/>
      </g>
    </g>

