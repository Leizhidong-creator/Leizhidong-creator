name: Update contribution spirit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate-contribution-spirit.mjs"
      - ".github/workflows/update-contribution-spirit.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution artwork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Leizhidong-creator
        run: node scripts/generate-contribution-spirit.mjs

      - name: Commit refreshed artwork
        run: |
          if git diff --quiet -- assets/contribution-spirit.svg; then
            echo "Contribution artwork is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-spirit.svg
          git commit -m "chore: refresh contribution spirit"
          git push
